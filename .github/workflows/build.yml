# Builds and tests Joktan, reports code coverage, and packages it for Windows, macOS and Linux.
# Windows builds are zipped as a single .exe and the README; macOS builds are zipped, unsigned .app bundles;
# Linux builds are a .tar.gz of a single executable and the README, since a tar keeps the executable's permission.
# It only runs when started by hand, from the Actions tab or with `gh workflow run build.yml`.
# The builds take their version from the commit's tag, which the Tag workflow makes.
# The Release workflow runs this one to make the builds it publishes.

name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to build, such as v1.2.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=$VERSION
          if [ -z "$version" ]; then
            version=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          if [ -z "$version" ]; then
            # A commit without a tag, such as one on another branch, is not a version of its own.
            version="v0.0.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # SkiaSharp needs fontconfig to load, and the tests of opening a terminal need one to find.
      - name: Install what the tests need on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 xterm

      - name: Build
        run: dotnet build Joktan.slnx -c Release

      - name: Test with coverage
        run: dotnet test --solution Joktan.slnx -c Release --no-build --coverage --coverage-output-format cobertura --results-directory TestResults

      - name: Report coverage
        shell: bash
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/*.cobertura.xml" -targetdir:TestResults/report -reporttypes:"Html;MarkdownSummaryGithub" -assemblyfilters:"+Joktan*;-*.Tests;-Joktan.Agent" -filefilters:"-*.g.cs"
          cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/report

  windows:
    needs: [ version, test ]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        rid: [ win-x64, win-arm64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Joktan/Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Keep only the exe
        shell: bash
        run: |
          # SkiaSharp and HarfBuzz bring native .pdb files that publishing copies next to the exe.
          rm -f publish/${{ matrix.rid }}/*.pdb
          extra=$(ls publish/${{ matrix.rid }} | grep -vx Joktan.exe || true)
          if [ -n "$extra" ]; then
            echo "::error::Files were left outside Joktan.exe:" $extra
            exit 1
          fi

      - name: Zip the exe with the README
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/Joktan.exe, README.md -DestinationPath Joktan-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.zip

  macos:
    needs: [ version, test ]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Joktan/Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Make the .app bundle
        run: |
          app="bundle/Joktan.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/${{ matrix.rid }}/. "$app/Contents/MacOS/"
          cp packaging/macos/Joktan.icns "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Joktan</string>
            <key>CFBundleDisplayName</key><string>Joktan</string>
            <key>CFBundleIdentifier</key><string>io.github.nagloopers.joktan</string>
            <key>CFBundleExecutable</key><string>Joktan</string>
            <key>CFBundleIconFile</key><string>Joktan.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          chmod +x "$app/Contents/MacOS/Joktan"
          # Ad-hoc signature so Apple Silicon will run it; it is not notarised.
          codesign --force --deep --sign - "$app"
          # ditto keeps the bundle's permissions and signature inside the zip.
          ditto -c -k --keepParent "$app" Joktan-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.zip

  linux:
    needs: [ version, test ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        rid: [ linux-x64, linux-arm64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Joktan/Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Keep only the executable
        run: |
          # SkiaSharp and HarfBuzz can bring native debug files that publishing copies next to it.
          rm -f publish/${{ matrix.rid }}/*.pdb publish/${{ matrix.rid }}/*.dbg
          extra=$(ls publish/${{ matrix.rid }} | grep -vx Joktan || true)
          if [ -n "$extra" ]; then
            echo "::error::Files were left outside Joktan:" $extra
            exit 1
          fi

      - name: Pack the executable with the README
        run: |
          chmod +x publish/${{ matrix.rid }}/Joktan
          tar -czf Joktan-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} Joktan -C "$PWD" README.md

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.tar.gz
